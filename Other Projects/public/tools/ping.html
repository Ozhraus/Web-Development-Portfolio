<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ping</title>
</head>
<body>
     <h1>Syntax</h1>
    ping {options} {ip|domain}
    <h2>Options</h2>
    -c {number}: define the number of packet to be sent (Linux)<br>
    -n {number}: define the number of packet to be sent (Windows) <br>
    
    <h3>Examples: ping with -c option</h3>
    ping -c 10 10.10.10.10 <br><br>

    <h3>Examples: ping with -n option (Windows)</h3>
    ping -n 10 10.10.10.10 <br><br>
    
</body>
</html>
